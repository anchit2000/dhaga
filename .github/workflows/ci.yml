name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default for GITHUB_TOKEN; jobs only read the checkout.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # onnxruntime-node fetches its native binary in a postinstall OUTSIDE the
      # npm cache, so a transient CDN timeout (ETIMEDOUT) can fail an otherwise
      # healthy install. Retry the whole install — postinstall included — before
      # failing the run.
      - run: |
          n=0
          until npm ci; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "npm ci failed after $n attempts"; exit 1; fi
            echo "npm ci failed — retry $n/3 in 15s…"
            sleep 15
          done
      - run: npm run typecheck --workspace @dhaga/core
      - run: npm run typecheck --workspace @dhaga/extension
      - run: npm run typecheck --workspace @dhaga/mobile
      - run: npm run test --workspace @dhaga/mobile
      - run: npm run build --workspace @dhaga/extension
      - run: npm run lint --prefix apps/web
      - run: npm run test --prefix apps/web
      - run: npm run build --prefix apps/web

  verify-without-ee:
    name: Verify AGPL core builds without packages/ee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Physically remove packages/ee, matching docs/SELF_HOSTING.md's "Level
      # 2" instructions, so this job proves the AGPL core in apps/web builds
      # standalone (see apps/web/src/lib/hosted/gate.ts for the dynamic-import
      # gate pattern that makes this possible).
      - run: |
          rm -rf packages/ee \
            apps/web/src/app/app/admin \
            apps/web/src/app/api/access-requests \
            apps/web/src/app/api/stripe \
            apps/web/src/lib/actions/admin \
            apps/web/src/components/app/admin \
            apps/web/src/components/app/table/AdminTables.tsx
          sed -i '/"@dhaga\/ee": "\*",/d' apps/web/package.json
          sed -i 's/\["@dhaga\/core", "@dhaga\/ee"\]/["@dhaga\/core"]/' apps/web/next.config.ts
      # Same retry as the verify job — onnxruntime-node's native-binary download
      # is the flaky step (ETIMEDOUT to its CDN), unrelated to the build.
      - run: |
          n=0
          until npm install; do
            n=$((n + 1))
            if [ "$n" -ge 3 ]; then echo "npm install failed after $n attempts"; exit 1; fi
            echo "npm install failed — retry $n/3 in 15s…"
            sleep 15
          done
      - run: npm run build --prefix apps/web
